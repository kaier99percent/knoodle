  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knoodle - Sign In</title>
  
  <link rel="icon" type="image/png" href="icon.png">

  <script>
    try {
      var savedTheme = localStorage.getItem('knoodle-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Share+Tech&display=swap" rel="stylesheet">

  <style>
    :root[data-theme="light"] {
      --bg-base: #F7F8F0;
      --surface: #ffffff;
      --text-main: #355872;
      --text-muted: #5a7d9a;
      --border: #7AAACE;
      --accent: #355872;
      --accent-hover: #24425c;
      --highlight: #9CD5FF;
      --error: #c94f4f;
    }

    :root[data-theme="dark"] {
      --bg-base: #1a222a;
      --surface: #243140;
      --text-main: #F7F8F0;
      --text-muted: #9CD5FF;
      --border: #355872;
      --accent: #9CD5FF;
      --accent-hover: #7AAACE;
      --highlight: #355872;
      --error: #ff6b6b;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, border-color 0.3s, color 0.3s;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 10% 10%, var(--highlight) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, var(--border) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(53, 88, 114, 0.1);
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo img { 
      width: 32px; 
      height: 32px; 
      border-radius: 8px; 
    }

    h1 { 
      margin: 24px 0 8px; 
      font-size: 28px; 
      font-weight: 700; 
    }

    .subtitle { 
      color: var(--text-muted); 
      font-weight: 500; 
      margin-bottom: 24px; 
      font-size: 15px; 
    }

    .tabs { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 24px; 
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-base);
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'Share Tech', monospace;
      font-size: 16px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .tabs button.active {
      background: var(--accent);
      color: var(--bg-base);
      border-color: var(--accent);
      font-weight: bold;
    }

    label { 
      display: block; 
      margin: 16px 0 8px; 
      font-family: 'Share Tech', monospace;
      font-size: 14px; 
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 16px;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      color: var(--text-main);
      background: var(--bg-base);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 2px var(--highlight);
    }

    input::placeholder { 
      color: var(--text-muted); 
      opacity: 0.5; 
    }

    .submit {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: var(--bg-base);
      font-size: 16px;
      font-family: 'Share Tech', monospace;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit:hover { 
      background: var(--accent-hover); 
    }

    .submit:disabled { 
      opacity: 0.6; 
      cursor: wait; 
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
      color: var(--accent);
    }

    .back { 
      display: block; 
      margin-top: 24px; 
      text-align: center; 
      color: var(--text-muted); 
      text-decoration: none; 
      font-size: 14px;
      transition: color 0.2s;
    }

    .back:hover { 
      color: var(--accent); 
      text-decoration: underline; 
    }

    .legal-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--bg-base);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech', monospace;
      font-size: 13px;
    }

    .legal-footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .legal-footer a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .legal-footer .dot {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .toggle-password:hover {
      color: var(--accent);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
    }

    .checkbox-group[hidden] {
      display: none;
    }

    .checkbox-group input {
      width: auto;
      margin-top: 4px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      text-transform: none;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    .checkbox-group a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
      <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <a class="logo" href="index.html">
      <img src="icon.png" alt="Knoodle">
      <span>Knoodle</span>
    </a>

    <h1 id="heading">Sign in</h1>
    <p class="subtitle" id="subtitle">Enter your details to access your workspace.</p>

    <div class="tabs">
      <button type="button" id="loginTab" class="active">Log In</button>
      <button type="button" id="signupTab">Sign Up</button>
    </div>

    <form id="authForm">
      
      <div id="signupFields" hidden>
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          placeholder="kaier99"
          minlength="3"
          maxlength="20"
          pattern="[a-zA-Z0-9_]{3,20}"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        >

        <label for="displayName">Display Name</label>
        <input
          id="displayName"
          type="text"
          placeholder="Kaier"
          maxlength="40"
          autocomplete="nickname"
        >
      </div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
          <svg id="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          <svg id="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>

      <div class="checkbox-group" id="termsGroup" hidden>
        <input type="checkbox" id="termsCheck" required>
        <label for="termsCheck">I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.</label>
      </div>

      <button class="submit" id="submitButton" type="submit">Log In</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <a class="back" href="index.html">Back to home</a>

    <div class="legal-footer">
      <a href="terms.html">Terms</a>
      <span class="dot">•</span>
      <a href="privacy.html">Privacy</a>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    const root = document.documentElement;

    function updateIcon(theme) {
      if (theme === 'dark') { 
        iconMoon.style.display = 'none'; 
        iconSun.style.display = 'block'; 
      } else { 
        iconMoon.style.display = 'block'; 
        iconSun.style.display = 'none'; 
      }
    }

    updateIcon(root.getAttribute('data-theme'));

    themeToggle.addEventListener('click', function() {
      const newTheme = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', newTheme);
      updateIcon(newTheme);
      try { localStorage.setItem('knoodle-theme', newTheme); } catch (e) {}
    });

    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeOpen = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeOpen.style.display = type === 'text' ? 'block' : 'none';
      eyeClosed.style.display = type === 'text' ? 'none' : 'block';
    });

    const form = document.getElementById("authForm");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const heading = document.getElementById("heading");
    const subtitle = document.getElementById("subtitle");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let mode = "login";

    function setMode(newMode) {
      mode = newMode;
      const isLogin = mode === "login";

      loginTab.classList.toggle("active", isLogin);
      signupTab.classList.toggle("active", !isLogin);

      heading.textContent = isLogin ? "Sign in" : "Create account";
      subtitle.textContent = isLogin
        ? "Enter your details to access your workspace."
        : "Enter your details to get started.";

      submitButton.textContent = isLogin ? "Log In" : "Sign Up";
      passwordInput.autocomplete = isLogin ? "current-password" : "new-password";
      message.textContent = "";
      
      document.getElementById("signupFields").hidden = isLogin;
      document.getElementById("termsGroup").hidden = isLogin;
      document.getElementById("termsCheck").hidden = isLogin;

      document.getElementById("username").required = !isLogin;
      document.getElementById("displayName").required = !isLogin;
      document.getElementById("termsCheck").required = !isLogin;
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    setMode("login");

    const params = new URLSearchParams(window.location.search);
    if (params.get("mode") === "signup") {
      setMode("signup");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      submitButton.disabled = true;
      submitButton.textContent = "...";

      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;

      try {
        if (typeof supabaseClient === "undefined") {
          throw new Error("Database connection failed.");
        }

        if (mode === "signup") {
          const username = document.getElementById("username").value.trim().toLowerCase();
          const displayName = document.getElementById("displayName").value.trim();

          if (!/^[a-z0-9_]{3,20}$/.test(username)) {
            throw new Error("Username must be 3-20 characters (letters, numbers, underscores).");
          }

          if (displayName.length < 1 || displayName.length > 40) {
            throw new Error("Display name must be between 1 and 40 characters.");
          }

          message.textContent = "Creating account...";

          const signupPromise = supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin + "/dashboard.html",
              data: {
                username,
                display_name: displayName
              }
            }
          });

          const timeoutPromise = new Promise((_, reject) => {
            setTimeout(() => reject(new Error("Request timed out.")), 15000);
          });

          const { data, error } = await Promise.race([signupPromise, timeoutPromise]);

          if (error) throw error;

          message.textContent = "Account created. Check your email to verify.";
          message.style.color = "var(--accent)";

        } else {
          const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          message.textContent = "Success. Redirecting...";
          message.style.color = "var(--accent)";

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        }
      } catch (error) {
        message.textContent = error.message || "An error occurred.";
        message.style.color = "var(--error)";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = mode === "login" ? "Log In" : "Sign Up";
      }
    });

    async function checkSession() {
      if (window.supabaseClient) {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session) {
          window.location.replace("dashboard.html");
        }
      }
    }
    checkSession();
  </script>
</body>
</html>
